name: flappy_rain
description: "Flappy Rain — a beautiful, storm-themed Flappy Bird game built with Flutter & Flame."
publish_to: "none"

# App version. Format is <marketing-version>+<build-number>.
# Bump the build number (after the +) for every store upload.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # 2D game engine — rendering loop, components, camera.
  flame: ^1.18.0

  # Sound effects (real synthesized WAV assets ship in assets/audio/).
  flame_audio: ^2.10.1

  # Persists best score, coin wallet, unlocked skins and settings.
  shared_preferences: ^2.2.3

  # Nice app icon / bird colors etc.
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates launcher icons for Android & iOS from a single source image.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # All visual art is drawn procedurally on the canvas. The only bundled
  # assets are the synthesized sound effects and the source app icon.
  assets:
    - assets/audio/
    - assets/icon/
    - assets/models/

  # Bundling the UI font keeps typography identical on Android and iOS instead
  # of falling back to each platform's default sans. Liberation Sans is SIL
  # OFL-licensed (see assets/fonts/LICENSE.txt).
  fonts:
    - family: Display
      fonts:
        - asset: assets/fonts/LiberationSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSans-Regular.ttf
          weight: 400

  shaders:
    - shaders/sky.frag
    - shaders/lens.frag

# Configuration for flutter_launcher_icons (run: dart run flutter_launcher_icons).
# Drop a 1024x1024 PNG at assets/icon/icon.png before running.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E2233"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
