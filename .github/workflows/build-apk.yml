name: Build installable app

# Produces the files you actually install:
#   * flappy-rain-apk       — a universal .apk you can download onto an Android
#                             phone and install by tapping it
#   * flappy-rain-aab       — the .aab Google Play wants for a store listing
#
# Runs on every push to the dev branch and on demand from the Actions tab.
# Tagging a commit `v1.0.0` also publishes the APK as a GitHub Release, which
# gives you a permanent download link you can send to anyone.

on:
  push:
    branches: ['claude/flappy-bird-game-dev-u9xw01', main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed only by the release job

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not available in a step-level `if`, so the
      # presence of a keystore is resolved here, at job level, where it is.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's runners already carry the Android SDK; this only needs a JDK
      # and Flutter on top of it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # An unsigned APK cannot be installed by anything. When the repository
      # has an upload keystore configured (see RELEASE.md) it is used; without
      # one the build falls back to the debug key, which still produces an APK
      # that installs and runs on any phone — it just isn't Play-uploadable.
      - name: Configure signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # versionCode comes from pubspec's `+1`, so every build would otherwise
      # ship as version 1: Google Play rejects a second upload at the same
      # versionCode, and a phone cannot tell two builds apart. The run number
      # only ever increases, which is the one property Android requires.
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Name the APK something a human recognises
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/flappy-rain.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/flappy-rain.aab
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: flappy-rain-apk
          path: dist/flappy-rain.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: flappy-rain-aab
          path: dist/flappy-rain.aab
          if-no-files-found: error

      # Publishing a release is what turns the build into a link anyone can
      # tap. Workflow *artifacts* require a GitHub login to download, which is
      # no good for handing the game to someone; release assets are public.
      #
      # A tagged build publishes under its version. Every other build refreshes
      # a rolling `latest` release, so the download link never changes as the
      # game is rebuilt. The action creates the tag itself, which also avoids
      # needing to push tags from a restricted environment.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Flappy Rain — latest build' }}
          files: |
            dist/flappy-rain.apk
            dist/flappy-rain.aab
          body: |
            ## Install on Android

            Download **flappy-rain.apk** below, open it on your phone, and tap
            Install. Android will ask once whether to allow installs from
            whichever app you downloaded with (Chrome, Files, …) — allow it and
            the install continues.

            `flappy-rain.aab` is only for uploading to Google Play; you do not
            need it to play.

            Build ${{ github.run_number }}, from commit ${{ github.sha }}.
